<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地图片压缩工具</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f4f7f9;
            --text-color: #333;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .upload-section {
            border: 2px dashed #ddd;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 25px;
            transition: border-color 0.3s;
            background: #fafafa;
        }
        .upload-section:hover {
            border-color: var(--primary-color);
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            cursor: pointer;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 1rem;
            transition: background 0.2s;
            gap: 8px;
        }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }

        .controls-section {
            padding: 20px;
            background: #f1f3f5;
            border-radius: 8px;
            margin-bottom: 25px;
            display: none; /* 初始隐藏 */
        }
        .control-group {
            margin-bottom: 15px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        input[type="range"] {
            flex-grow: 1;
            height: 6px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }
        .quality-value {
            font-weight: bold;
            color: var(--primary-color);
            min-width: 40px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            display: none; /* 初始隐藏 */
        }
        .preview-box {
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
        .preview-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .img-wrapper {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
            flex-grow: 1;
            /* 使用格子背景以便看清图片边缘 */
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee), 
                              linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        .img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .file-info {
            font-size: 0.9rem;
            color: #555;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .size-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .bg-original { background: #e9ecef; color: #495057; }
        .bg-compressed { background: #d4edda; color: #155724; }

        .download-section {
            text-align: center;
            margin-top: 30px;
            display: none; /* 初始隐藏 */
        }
        .btn-download {
            background-color: #28a745;
            padding: 12px 30px;
            font-size: 1.1rem;
        }
        .btn-download:hover { background-color: #218838; }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🖼️ 本地图片压缩与旋转工具</h1>

    <div class="upload-section">
        <label for="fileInput" class="btn">
            📁 选择一张图片
        </label>
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg, image/webp">
        <p style="margin-top: 10px; color: #888; font-size: 0.9em;">完全本地运行，支持 PNG, JPG, WebP 格式</p>
    </div>

    <div class="controls-section" id="controlsSection">
        <div class="control-group">
            <label for="qualitySlider" style="font-weight: 600;">压缩质量:</label>
            <div class="slider-container">
                <span>低</span>
                <input type="range" id="qualitySlider" min="0.1" max="1.0" step="0.05" value="0.8">
                <span>高</span>
                <span class="quality-value" id="qualityValueText">0.8</span>
            </div>
        </div>
    </div>

    <div class="preview-container" id="previewContainer">
        <div class="preview-box">
            <h3>原始图片</h3>
            <div class="img-wrapper">
                <img id="originalImage" src="" alt="Original Preview">
            </div>
            <div class="file-info">
                原始大小: <span class="size-badge bg-original" id="originalSize">-</span>
            </div>
        </div>

        <div class="preview-box">
            <h3>
                处理预览
                <button class="btn btn-secondary" id="rotateBtn" style="padding: 5px 10px; font-size: 0.9rem;">
                    🔄 旋转 90°
                </button>
            </h3>
            <div class="img-wrapper">
                <img id="compressedImage" src="" alt="Processed Preview">
            </div>
            <div class="file-info">
                预计大小: <span class="size-badge bg-compressed" id="compressedSize">-</span>
                <span id="compressionRatio" style="font-size: 0.85em; margin-left: 5px;"></span>
            </div>
        </div>
    </div>

    <div class="download-section" id="downloadSection">
        <button id="downloadBtn" class="btn btn-download">
            ⬇️ 下载处理后的图片
        </button>
    </div>

</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const controlsSection = document.getElementById('controlsSection');
    const previewContainer = document.getElementById('previewContainer');
    const downloadSection = document.getElementById('downloadSection');
    
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValueText = document.getElementById('qualityValueText');
    const rotateBtn = document.getElementById('rotateBtn');
    
    const originalImage = document.getElementById('originalImage');
    const compressedImage = document.getElementById('compressedImage');
    const originalSizeText = document.getElementById('originalSize');
    const compressedSizeText = document.getElementById('compressedSize');
    const compressionRatioText = document.getElementById('compressionRatio');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentFile = null;
    let sourceImageObj = new Image();
    let compressedBlob = null;
    
    // 状态管理
    let currentRotation = 0; // 取值: 0, 90, 180, 270
    const MAX_WIDTH_HEIGHT = 1920; 

    function formatSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        currentFile = file;
        currentRotation = 0; // 重置旋转角度
        originalSizeText.textContent = formatSize(file.size);
        
        controlsSection.style.display = 'block';
        previewContainer.style.display = 'grid';
        downloadSection.style.display = 'block';

        const reader = new FileReader();
        reader.onload = (event) => {
            originalImage.src = event.target.result;
            sourceImageObj.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    sourceImageObj.onload = () => {
        processImage();
    };

    qualitySlider.addEventListener('input', (e) => {
        qualityValueText.textContent = e.target.value;
        processImage();
    });

    rotateBtn.addEventListener('click', () => {
        currentRotation = (currentRotation + 90) % 360;
        processImage();
    });

    // 核心处理函数：缩放、旋转、压缩
    function processImage() {
        if (!sourceImageObj.src) return;

        const quality = parseFloat(qualitySlider.value);
        const canvas = document.createElement('canvas');
        
        // 1. 计算缩放后的基础尺寸
        let drawWidth = sourceImageObj.width;
        let drawHeight = sourceImageObj.height;

        if (drawWidth > MAX_WIDTH_HEIGHT || drawHeight > MAX_WIDTH_HEIGHT) {
            if (drawWidth > drawHeight) {
                drawHeight = Math.round((drawHeight * MAX_WIDTH_HEIGHT) / drawWidth);
                drawWidth = MAX_WIDTH_HEIGHT;
            } else {
                drawWidth = Math.round((drawWidth * MAX_WIDTH_HEIGHT) / drawHeight);
                drawHeight = MAX_WIDTH_HEIGHT;
            }
        }

        // 2. 根据旋转角度设定 Canvas 画布的最终尺寸
        // 如果是 90 度或 270 度，画布的宽高需要对调
        if (currentRotation === 90 || currentRotation === 270) {
            canvas.width = drawHeight;
            canvas.height = drawWidth;
        } else {
            canvas.width = drawWidth;
            canvas.height = drawHeight;
        }

        const ctx = canvas.getContext('2d');
        
        // 填充白色背景（防止透明 PNG 变黑）
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 3. 执行旋转绘制操作
        // 将原点移动到画布中心
        ctx.translate(canvas.width / 2, canvas.height / 2);
        // 旋转坐标系 (弧度制)
        ctx.rotate((currentRotation * Math.PI) / 180);
        // 绘制图片时，将图片的中心点对准刚刚移动过来的坐标原点
        ctx.drawImage(sourceImageObj, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);

        // 4. 导出压缩后的 Blob
        canvas.toBlob((blob) => {
            if (!blob) return;
            compressedBlob = blob;
            
            // 更新 UI
            compressedSizeText.textContent = formatSize(blob.size);
            compressedImage.src = URL.createObjectURL(blob);
            
            const ratio = Math.round((1 - (blob.size / currentFile.size)) * 100);
            if (ratio > 0) {
                compressionRatioText.textContent = `(省 ${ratio}%)`;
                compressionRatioText.style.color = '#28a745';
            } else {
                compressionRatioText.textContent = `(增大)`;
                compressionRatioText.style.color = '#dc3545';
            }
        }, 'image/jpeg', quality);
    }

    downloadBtn.addEventListener('click', () => {
        if (!compressedBlob) return;
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(compressedBlob);
        const originalNameStr = currentFile.name.split('.')[0];
        // 标注包含了处理状态的文件名
        let suffix = '_compressed';
        if (currentRotation !== 0) {
            suffix += '_rotated';
        }
        link.download = `${originalNameStr}${suffix}.jpg`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

</script>

</body>
</html>
